<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Waymark</title>
  <desc id="desc">Spec-driven development: you decide, agents write. A trail of waypoints shows a change going explore, propose, specs, design, tasks, accept, apply, review, archive; accept and archive are the human's gates.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172340"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card">
      <rect width="1280" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#sky)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>

    <!-- Contour lines, like a trail map -->
    <g fill="none" stroke="#e2e8f0" stroke-width="1.2">
      <path d="M1052 112 m-70 0 a70 46 -12 1 0 140 0 a70 46 -12 1 0 -140 0" stroke-opacity="0.16"/>
      <path d="M1048 114 m-128 0 a128 84 -12 1 0 256 0 a128 84 -12 1 0 -256 0" stroke-opacity="0.12"/>
      <path d="M1044 116 m-190 0 a190 126 -12 1 0 380 0 a190 126 -12 1 0 -380 0" stroke-opacity="0.09"/>
      <path d="M1040 118 m-256 0 a256 170 -12 1 0 512 0 a256 170 -12 1 0 -512 0" stroke-opacity="0.07"/>
      <path d="M1036 120 m-326 0 a326 216 -12 1 0 652 0 a326 216 -12 1 0 -652 0" stroke-opacity="0.05"/>
    </g>

    <!-- Wordmark -->
    <g transform="translate(72 132)">
      <rect x="0" y="-38" width="34" height="34" rx="4" transform="rotate(45 17 -21)" fill="#f59e0b"/>
      <text x="64" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-2" fill="#f8fafc">waymark</text>
    </g>
    <text x="72" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#94a3b8">Spec-driven development. <tspan fill="#e2e8f0">You decide; agents write.</tspan></text>

    <!-- The trail: a change from idea to archive -->
    <line x1="72" y1="282" x2="214" y2="282" stroke="#64748b" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <line x1="214" y1="282" x2="1208" y2="282" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.45"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">
      <!-- explore: optional -->
      <circle cx="72" cy="282" r="8" fill="#0b1220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="72" y="322" fill="#94a3b8">explore</text>

      <circle cx="214" cy="282" r="8" fill="#38bdf8"/>
      <text x="214" y="322" fill="#cbd5e1">propose</text>
      <circle cx="356" cy="282" r="8" fill="#38bdf8"/>
      <text x="356" y="322" fill="#cbd5e1">specs</text>
      <circle cx="498" cy="282" r="8" fill="#38bdf8"/>
      <text x="498" y="322" fill="#cbd5e1">design</text>
      <circle cx="640" cy="282" r="8" fill="#38bdf8"/>
      <text x="640" y="322" fill="#cbd5e1">tasks</text>

      <!-- accept: the human's gate -->
      <rect x="770" y="270" width="24" height="24" rx="3" transform="rotate(45 782 282)" fill="#f59e0b"/>
      <text x="782" y="322" fill="#fbbf24" font-weight="700">accept</text>
      <text x="782" y="248" fill="#fbbf24" font-size="13">you</text>

      <circle cx="924" cy="282" r="8" fill="#38bdf8"/>
      <text x="924" y="322" fill="#cbd5e1">apply</text>
      <circle cx="1066" cy="282" r="8" fill="#38bdf8"/>
      <text x="1066" y="322" fill="#cbd5e1">review</text>

      <!-- archive: the human's gate -->
      <rect x="1196" y="270" width="24" height="24" rx="3" transform="rotate(45 1208 282)" fill="#f59e0b"/>
      <text x="1196" y="322" fill="#fbbf24" font-weight="700">archive</text>
      <text x="1208" y="248" fill="#fbbf24" font-size="13">you</text>
    </g>
  </g>
</svg>
