name: Release

# Runs when the maintainer pushes a version tag such as v0.1.0, and only then.
# PyPI trusts this workflow through trusted publishing: no token is stored.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Verify, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: uv sync --locked --python 3.15
      - name: Check the tag, the version, the changelog and the smoke test
        run: uv run --no-sync python -m tools.release check "$GITHUB_REF_NAME"
      - name: Test
        run: uv run --no-sync pytest
      - name: Check the generated docs are current
        run: uv run --no-sync python -m tools.docs --check
      - name: Build
        run: uv build
      - name: Run wm from the built wheel
        run: uv tool run --python 3.11 --from dist/*.whl wm --version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --python 3.15 python -m tools.release notes "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
