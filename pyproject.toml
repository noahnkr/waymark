[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "waymark-cli"
dynamic = ["version"]
description = "Spec-driven development for developers who stay in charge of their project while agents write the code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# Standard library only at runtime: this list stays empty.
dependencies = []
keywords = ["spec-driven-development", "coding-agents", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
    "Typing :: Typed",
]

[project.scripts]
wm = "waymark.cli:main"

[project.urls]
Repository = "https://github.com/noahnkr/waymark"

[dependency-groups]
dev = [
    "codespell>=2.4",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.hatch.version]
path = "src/waymark/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/waymark"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.codespell]
# American English everywhere: the last dictionary rejects British spellings.
builtin = "clear,rare,en-GB_to_en-US"
check-hidden = true
check-filenames = true
skip = ".git,.venv,dist,uv.lock,.mypy_cache,.pytest_cache,.ruff_cache,__pycache__"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "N",    # naming
    "UP",   # modern syntax for the minimum Python
    "B",    # likely bugs
    "A",    # shadowed builtins
    "C4",   # comprehensions
    "PT",   # pytest style
    "PTH",  # pathlib over os.path
    "RET",  # return consistency
    "SIM",  # simplifications
    "TID",  # tidy imports
    "PL",   # pylint
    "RUF",  # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913"]  # literal values; builders with many options

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
